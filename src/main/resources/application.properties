server.port=8080
spring.application.name=HackTrack

# ── AI schedule extraction ───────────────────────────────────────────────
# The API key is read from the GEMINI_API_KEY environment variable. It is never
# stored in this file, in SQLite, or sent to the browser.
hacktrack.ai.api-key=${GEMINI_API_KEY:}
hacktrack.ai.model=${GEMINI_MODEL:gemini-flash-lite-latest}
hacktrack.ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
hacktrack.ai.connect-timeout-seconds=${GEMINI_CONNECT_TIMEOUT_SECONDS:10}
hacktrack.ai.request-timeout-seconds=${GEMINI_REQUEST_TIMEOUT_SECONDS:60}
hacktrack.ai.max-content-chars=${GEMINI_MAX_CONTENT_CHARS:24000}
hacktrack.ai.max-follow-links=${GEMINI_MAX_FOLLOW_LINKS:2}
hacktrack.ai.max-page-bytes=${GEMINI_MAX_PAGE_BYTES:3000000}

# Headless-browser fallback, used only when the HTTP extraction above returns too
# little readable text (for example a React/Vue page that renders client-side).
# Set RENDER_FALLBACK_ENABLED=false to keep extraction HTTP-only.
hacktrack.ai.render-fallback-enabled=${RENDER_FALLBACK_ENABLED:true}
hacktrack.ai.min-text-chars-for-render-fallback=${RENDER_MIN_TEXT_CHARS:400}
hacktrack.ai.render-timeout-seconds=${RENDER_TIMEOUT_SECONDS:45}
hacktrack.ai.render-settle-millis=${RENDER_SETTLE_MILLIS:1500}

# Optional local overrides. Ignored by git - keep GEMINI_API_KEY in the environment.
spring.config.import=optional:file:./config/application-local.properties
