<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackTrack - Hackathon Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="logo">&#9889;</div>
                <div>
                    <h1>HackTrack</h1>
                    <p class="header-subtitle">Hackathon Tracking &amp; Stage Management</p>
                </div>
            </div>
            <div class="header-stats" id="statusBar">Loading...</div>
        </div>
    </header>

    <main>
        <section class="tab-section">
            <div class="toolbar">
                <div class="search-box">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchField" placeholder="Search hackathons..." oninput="filterHackathons()">
                </div>
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" onclick="loadHackathons()">&#8635; Refresh</button>
                    <button class="btn btn-primary" onclick="showAddHackathon()">+ Add Hackathon</button>
                </div>
            </div>

            <div class="table-container" id="hackathonList">
                <p class="loading">Loading hackathons...</p>
            </div>

            <div id="stagePanel" class="stage-panel hidden">
                <div class="stage-panel-header">
                    <div>
                        <h3 id="selectedHackathonName">Select a hackathon</h3>
                        <p class="stage-panel-hint" id="selectedHackathonUrl"></p>
                    </div>
                    <div class="stage-actions">
                        <button class="btn btn-secondary btn-sm" onclick="showAiScheduleModal()">&#129504; AI Schedule</button>
                        <button class="btn btn-primary btn-sm" onclick="showAddStage()">+ Add Stage</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteHackathon()">&#128465; Delete</button>
                    </div>
                </div>
                <div class="status-row">
                    <div id="overallStatus" class="overall-status"></div>
                    <div id="nextStage" class="next-stage"></div>
                </div>
                <div id="stageList" class="stage-list"></div>
            </div>
        </section>

        <section class="tab-section">
            <div class="section-header">
                <h3>&#128203; Participation History</h3>
            </div>
            <div class="table-container" id="historyList">
                <p class="loading">Loading history...</p>
            </div>
        </section>

        <section class="tab-section">
            <div class="section-header">
                <h3>&#9993; Gmail Reminders</h3>
            </div>
            <div class="gmail-panel">
                <div class="gmail-status-row">
                    <div class="gmail-status-label">
                        <span class="gmail-indicator" id="gmailIndicator"></span>
                        <span id="gmailStatusText">Checking...</span>
                    </div>
                    <div class="gmail-actions">
                        <button class="btn btn-sm" id="gmailConnectBtn" onclick="connectGmail()">Connect Gmail</button>
                        <button class="btn btn-sm btn-danger hidden" id="gmailDisconnectBtn" onclick="disconnectGmail()">Disconnect</button>
                    </div>
                </div>
                <div class="gmail-recipient-row">
                    <label for="recipientEmailInput">Reminder recipient email:</label>
                    <div class="gmail-recipient-input">
                        <input type="email" id="recipientEmailInput" placeholder="you@example.com">
                        <button class="btn btn-sm btn-primary" onclick="saveRecipientEmail()">Save</button>
                    </div>
                </div>
                <div class="gmail-test-row">
                    <button class="btn btn-sm btn-secondary" onclick="sendTestEmail()">Send Test Email</button>
                    <span id="gmailLastReminder" class="gmail-last-reminder"></span>
                </div>
                <div id="gmailMessage" class="gmail-message hidden"></div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal hidden" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Title</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>HackTrack &mdash; Stage-Aware Hackathon Tracking &amp; Elimination-Aware Reminder System</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
